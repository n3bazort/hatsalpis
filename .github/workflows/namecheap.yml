name: Publish landing to Namecheap
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: namecheap-production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.NAMECHEAP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: namecheap-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify responsive layouts and storefront before publishing
        run: npm run test:e2e
      - run: npm run build
      - name: Configure authenticated SSH
        env:
          SSH_KEY: ${{ secrets.NAMECHEAP_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.NAMECHEAP_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Upload assets then publish entry point
        env:
          DEPLOY_HOST: ${{ secrets.NAMECHEAP_HOST }}
          DEPLOY_USER: ${{ secrets.NAMECHEAP_USER }}
          DEPLOY_PORT: ${{ secrets.NAMECHEAP_PORT }}
        run: bash scripts/deploy-namecheap.sh
